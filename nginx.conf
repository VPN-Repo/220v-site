server_tokens off;

set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=sendcode:10m rate=8r/m;
limit_req_zone $binary_remote_addr zone=verify:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=checkout:10m rate=500r/m;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

# Enable these if the nginx image includes the brotli module.
# brotli on;
# brotli_static on;
# brotli_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://lcab.talk-me.ru https://static.site-chat.me; connect-src 'self' https://lcab.talk-me.ru https://static.site-chat.me wss://lcab.talk-me.ru wss://static.site-chat.me; img-src 'self' data: blob: https://api.qrserver.com https://fs.site-chat.me; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(?:icon-192|icon-512|icon-512-maskable|apple-touch-icon-180|favicon-32|404-illustration)\.(?:png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ^~ /admin/redis {
        auth_basic "220v Redis Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    location = /pay/success {
        if ($request_method = POST) {
            return 303 /pay/success$is_args$args;
        }
        try_files /index.html =404;
    }

    location = /pay/fail {
        if ($request_method = POST) {
            return 303 /pay/fail$is_args$args;
        }
        try_files /index.html =404;
    }

    location ^~ /api/admin/ {
        auth_basic "220v Redis Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        client_max_body_size 16k;
        proxy_pass http://api:3001/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Отправка OTP: дольше остальных, потому что upstream синхронно
    # ждёт ответа AWS SES SMTP. Холодный SMTP-диалог (TCP + STARTTLS на
    # 587 + EHLO/AUTH/MAIL FROM/RCPT TO/DATA) может занять до ~15 сек.
    # Таймаут должен перекрывать SMTP socketTimeout из api/mailer.mjs,
    # иначе клиент получает обрыв соединения, хотя письмо в итоге уходит.
    location = /api/auth/send-code {
        limit_req zone=sendcode burst=4 nodelay;
        client_max_body_size 16k;
        proxy_pass http://api:3001/api/auth/send-code;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    location = /api/auth/verify {
        limit_req zone=verify burst=15 nodelay;
        client_max_body_size 16k;
        proxy_pass http://api:3001/api/auth/verify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    location = /api/checkout {
        limit_req zone=checkout burst=125 nodelay;
        client_max_body_size 16k;
        proxy_pass http://api:3001/api/checkout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Talk-Me chat: no auth_basic, no tight body limit (multipart uploads)
    location ^~ /api/talkme/ {
        client_max_body_size 64m;
        proxy_pass http://api:3001/api/talkme/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/support/chat-attachment {
        client_max_body_size 64m;
        proxy_pass http://api:3001/api/support/chat-attachment;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/support/chat-attachment/ {
        client_max_body_size 64m;
        proxy_pass http://api:3001/api/support/chat-attachment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 16k;
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
