<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>220v — подписка в Happ одним тапом</title>
    <link rel="stylesheet" href="/happ.css" />

  <body>
    <main>
      <h1 id="title">Запускаем Happ…</h1>
      <p id="text">Подписка 220v подключится сама, ничего копировать не нужно.</p>
      <a id="open" class="button" href="/" hidden>Запустить Happ</a>
      <p id="hint" class="hint" hidden>Не открылось? Жми кнопку. Если Happ ещё не стоит на устройстве — поставь его по инструкции в боте или на сайте.</p>
      <p id="bad" class="hint" hidden>Ссылка не сработала. Зайди в боте в «Моя подписка» и нажми кнопку заново.</p>
      <a class="site" href="/">На сайт 220v</a>
    </main>
    <script src="/happ.js"></script>
  </body>
